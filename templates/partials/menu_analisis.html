{# Menú lateral del módulo: análisis agrupados por tipo #}
<aside class="menu-lateral" style="--c: {{ modulo.color }}">
  <a class="menu-modulo{% if not item %} activo{% endif %}" href="{{ modulo.url }}">
    <span class="modulo-icono"><i class="bi {{ modulo.icono }}" aria-hidden="true"></i></span>
    <span>{{ modulo.titulo }}</span>
  </a>

  <button class="btn-menu d-lg-none" type="button" data-bs-toggle="collapse" data-bs-target="#menu-analisis"
          aria-expanded="false" aria-controls="menu-analisis">
    <i class="bi bi-list" aria-hidden="true"></i>
    {% if item %}{{ item.titulo }}{% else %}Elegir un análisis{% endif %}
    <i class="bi bi-chevron-down ms-auto" aria-hidden="true"></i>
  </button>

  <nav class="collapse d-lg-block" id="menu-analisis" aria-label="Análisis de {{ modulo.titulo }}">
    {% for tipo_slug, tipo, lista in grupos %}
    <div class="menu-grupo menu-{{ tipo_slug }}">
      <div class="menu-tipo">
        <i class="bi {{ tipo.icono }}" aria-hidden="true"></i>
        <span><strong>{{ tipo.titulo }}</strong> {{ tipo.pregunta }}</span>
      </div>
      <ul>
        {% for a in lista %}
        <li>
          <a href="{% url 'core:analisis' modulo.slug a.slug %}{% if periodo %}?periodo={{ periodo }}{% endif %}"
             class="{% if item.slug == a.slug %}activo{% endif %}"
             {% if item.slug == a.slug %}aria-current="page"{% endif %}>{{ a.titulo }}</a>
        </li>
        {% empty %}
        <li class="menu-vacio">Sin análisis todavía</li>
        {% endfor %}
      </ul>
    </div>
    {% endfor %}
  </nav>
</aside>
